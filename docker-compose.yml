# PostgreSQL para o pipeline IoT.
# Os scripts em ./sql são executados automaticamente na primeira
# inicialização do volume (cria a tabela e as 3 views).
services:
  postgres-iot:
    image: postgres:16
    container_name: postgres-iot
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_pass}
      POSTGRES_DB: ${POSTGRES_DB:-iot_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
